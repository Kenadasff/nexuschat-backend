services:
  - type: web
    name: nexuschat-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nexuschat-db
          property: connectionString

databases:
  - name: nexuschat-db
    plan: free
